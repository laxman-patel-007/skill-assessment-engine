<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Skill Assessment Engine</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #2d5a2d; }
        .error { background: #5a2d2d; }
        .info { background: #2d4a5a; }
    </style>
</head>
<body>
    <h1>Skill Assessment Engine - Test Page</h1>
    <div id="test-results"></div>

    <script type="module">
        const resultsDiv = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        try {
            addResult('Starting tests...', 'info');
            
            // Test 1: Import Firebase mock
            const { db, collection, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc, writeBatch, doc } = await import('./js/firebase-init.js');
            addResult('✅ Firebase mock imported successfully', 'success');
            
            // Test 2: Test collection creation
            const skillsCol = collection(db, 'skills');
            addResult('✅ Collection created successfully', 'success');
            
            // Test 3: Test getDocs
            const snapshot = await getDocs(skillsCol);
            addResult(`✅ getDocs works - found ${snapshot.docs.length} documents`, 'success');
            
            // Test 4: Test getDoc
            if (snapshot.docs.length > 0) {
                const docRef = doc(db, 'skills', snapshot.docs[0].id);
                const docSnapshot = await getDoc(docRef);
                addResult(`✅ getDoc works - document exists: ${docSnapshot.exists()}`, 'success');
            } else {
                addResult('⚠️ getDoc test skipped - no documents found', 'info');
            }
            
            // Test 5: Test database functions
            const { getSkills, getQuestions, getAssessments } = await import('./js/db.js');
            addResult('✅ Database functions imported successfully', 'success');
            
            // Test 6: Test data retrieval
            const skills = await getSkills();
            const questions = await getQuestions();
            const assessments = await getAssessments();
            
            addResult(`✅ Skills loaded: ${skills.length}`, 'success');
            addResult(`✅ Questions loaded: ${questions.length}`, 'success');
            addResult(`✅ Assessments loaded: ${assessments.length}`, 'success');
            
            // Test 7: Test UI functions
            const { renderDashboard, showSection } = await import('./js/ui.js');
            addResult('✅ UI functions imported successfully', 'success');
            
            // Test 8: Test algorithms
            const { selectQuestionsForAssessment, calculateProficiency } = await import('./js/algorithms.js');
            addResult('✅ Algorithm functions imported successfully', 'success');
            
            addResult('🎉 All tests passed! Application is ready to use.', 'success');
            addResult('You can now go to http://localhost:8001 to use the application.', 'info');
            addResult('Test page: http://localhost:8001/test.html', 'info');
            
        } catch (error) {
            addResult(`❌ Test failed: ${error.message}`, 'error');
            console.error('Test error:', error);
        }
    </script>
</body>
</html>
